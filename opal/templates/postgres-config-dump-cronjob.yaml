{{- if .Values.postgres.config.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ printf "%s-dump-cronjob" .Values.postgres.config.name }}
  labels:
    {{- include "postgres.config.dump.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.postgres.config.backup.schedule | quote }}
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: postgres-dump
              image: {{ .Values.postgres.config.image }}
              env:
                - name: POSTGRES_USER
              {{- if or .Values.postgres.config.existingSecret .Values.global.existingSecret }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.postgres.config.existingSecret | default .Values.global.existingSecret }}
                      key: {{ .Values.postgres.config.existingSecretKeys.user }}
              {{- else }}
                  value: {{ .Values.postgres.config.user | quote }}
              {{- end }}
                - name: POSTGRES_PASSWORD
              {{- if or .Values.postgres.config.existingSecret .Values.global.existingSecret }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.postgres.config.existingSecret | default .Values.global.existingSecret }}
                      key: {{ .Values.postgres.config.existingSecretKeys.password }}
              {{- else }}
                  value: {{ .Values.postgres.config.password | quote }}
              {{- end }}
                - name: POSTGRES_HOST
                  value: {{ .Values.postgres.config.host | quote }}
                - name: POSTGRES_PORT
                  value: {{ .Values.postgres.config.port | quote }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e -o pipefail
                  BACKUP_DATE=$(date +%F_%H%M%S)
                  echo "Starting PostgreSQL config backup for date: $BACKUP_DATE"
                  
                  export PGPASSWORD="${POSTGRES_PASSWORD}"
                  pg_dumpall -h ${POSTGRES_HOST} -p ${POSTGRES_PORT} -U ${POSTGRES_USER} \
                    | gzip -4 > /dump/postgres-config-$BACKUP_DATE.sql.gz
                  
                  echo "PostgreSQL config backup completed at $(date)"
                  
                  # Clean up old backups based on limit
                  BACKUP_LIMIT={{ .Values.postgres.config.backup.limit | default 10 }}
                  echo "Keeping only $BACKUP_LIMIT most recent PostgreSQL config backups"
                  
                  # Clean up old backup files
                  cd /dump && ls -t postgres-config-*.sql.gz 2>/dev/null | tail -n +$((BACKUP_LIMIT + 1)) | xargs -r rm -f
                  
                  echo "PostgreSQL config backup cleanup completed. Current backups:"
                  ls -la /dump/postgres-config-*.sql.gz 2>/dev/null | sort || echo "No backup files found"
              volumeMounts:
                - name: postgres-dump
                  mountPath: /dump
          volumes:
            - name: postgres-dump
              persistentVolumeClaim:
                claimName: {{ printf "%s-dump-pvc" .Values.postgres.config.name }}
          restartPolicy: OnFailure
{{- end }}