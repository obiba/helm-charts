{{- if .Values.postgres.ids.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgres.ids.name }}
  labels:
    {{- include "postgres.ids.labels" . | nindent 4 }}
  {{- with .Values.postgres.ids.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.postgres.ids.service.type | default "ClusterIP" }}
  ports:
    - port: 5432
  selector:
    {{- include "postgres.ids.selectorLabels" . | nindent 4 }}
{{- end }}
